<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BusLive</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b6fd6; color: #fff; font: 16px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; text-align: center; }
  main { padding: 16px; width: min(360px, 100%); box-sizing: border-box; }
  b { display: block; font-size: 26px; margin-bottom: 4px; }
  .maps { display: grid; gap: 12px; margin-top: 18px; }
  button { font: inherit; font-size: 20px; font-weight: 700; padding: 16px; border: 0; border-radius: 14px; background: #fff; color: #0b6fd6; cursor: pointer; }
  button small { display: block; font-size: 13px; font-weight: 400; color: #4a6c90; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { min-height: 24px; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <b>BusLive</b>
  <div>맵을 골라 주세요</div>
  <div class="maps">
    <button data-file="link.txt">남천<small>남천 · 청진 (시간표 + 운전 중인 사람 실시간)</small></button>
    <button data-file="link_seoul.txt">서울<small>목동 · 신촌 · 서울역 (실시간)</small></button>
  </div>
  <p id="msg"></p>
</main>
<script>
function read(url, options) {
  return fetch(url, options).then(function (r) { if (!r.ok) throw 0; return r.text(); });
}
function go(file) {
  var msg = document.getElementById('msg');
  msg.textContent = '연결하는 중이에요';
  document.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  // The API has the new address at once; the Pages copy can lag by minutes.
  read('https://api.github.com/repos/dreamstation1/dreamstation1.github.io/contents/buslive/' + file + '?t=' + Date.now(),
       { cache: 'no-store', headers: { Accept: 'application/vnd.github.raw+json' } })
    .catch(function () { return read(file + '?t=' + Date.now(), { cache: 'no-store' }); })
    .then(function (t) {
      var url = t.trim();
      if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) throw 0;
      location.replace(url);
    })
    .catch(function () {
      msg.textContent = '주소를 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';
      document.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
    });
}
document.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.file); }); });
// ?map=seoul / ?map=ncc goes straight there (for bookmarks)
var m = new URLSearchParams(location.search).get('map');
if (m === 'seoul') go('link_seoul.txt');
else if (m === 'ncc' || m === 'namcheon') go('link.txt');
</script>
</body>
</html>
